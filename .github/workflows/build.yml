name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build with ndk-build
        working-directory: AndKittyInjector
        run: |
          ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build -j$(nproc) \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            NDK_OUT=ndk_build/obj \
            NDK_LIBS_OUT=ndk_build/libs

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          mkdir -p release
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "AndKittyInjector/ndk_build/libs/${abi}/AndKittyInjector" "release/AndKittyInjector-${abi}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AndKittyInjector
          path: AndKittyInjector/ndk_build/libs/*/AndKittyInjector

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
